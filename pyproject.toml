[project]
name = "statewave-openrouter"
version = "1.0.0"
description = "OpenAI-compatible proxy that injects Statewave memory into OpenRouter calls and writes each turn back."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.139.1,<1",
    "uvicorn[standard]>=0.51.0,<1",
    "httpx>=0.28.1,<1",
    "pyjwt>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.15.21,<1",
]

[project.urls]
Homepage = "https://statewave.ai"
Repository = "https://github.com/smaramwbc/statewave-openrouter"
Issues = "https://github.com/smaramwbc/statewave/issues"
Documentation = "https://github.com/smaramwbc/statewave-docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["statewave_openrouter.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
